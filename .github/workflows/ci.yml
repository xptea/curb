name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install native text and graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libepoxy0 fonts-dejavu-core
      - name: Check formatting, vet, tests, and packaging syntax
        run: make check
      - name: Build Linux application
        run: make build
      - name: Check other desktop targets compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -buildvcs=false -o build/curb-darwin .
          GOOS=windows GOARCH=amd64 go build -buildvcs=false -o build/curb-windows.exe .
