name: Publish update feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-update-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'xptea/curb'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Read the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/curb-release.json"
      - name: Generate the version file
        run: python3 scripts/update_manifest.py --release-json "$RUNNER_TEMP/curb-release.json"
      - name: Commit the published version to main
        run: |
          if git diff --quiet -- version.json; then
            echo "The update feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Update desktop release feed"
          git push origin HEAD:main
